# Gate on pull requests and on code pushed to main; documentation-only
# changes skip it. Deploys are NOT done here: each company's Dokploy pulls
# `main` itself and builds the image (docs/DEPLOYMENTS.md), so the image is
# built here on pull requests only.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "skills/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "skills/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notifyd
          POSTGRES_PASSWORD: notifyd
          POSTGRES_DB: notifyd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notifyd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://notifyd:notifyd@localhost:5432/notifyd_test
      JWT_SECRET: ci-only-secret-0123456789abcdef
      ADMIN_API_KEY: ci-only-admin
      EMAIL_PROVIDER: log
      EMAIL_FROM: ci@example.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Image builds and embeds the commit
        if: github.event_name == 'pull_request'
        run: |
          docker build -t notifyd:ci .
          docker run --rm --entrypoint sh notifyd:ci -c 'test -x /usr/local/bin/notifyd && ls migrations | wc -l'

  clients:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: TypeScript client typechecks and builds
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit --strict --target es2020 --moduleResolution bundler --module esnext --skipLibCheck sdk/index.ts
          pnpm run build:sdk
          git diff --exit-code -- sdk/dist || { echo "sdk/dist is stale: run pnpm build:sdk and commit"; exit 1; }
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Python client tests and build
        working-directory: clients/python
        run: |
          uv venv
          uv pip install -e . pytest pytest-asyncio
          .venv/bin/python -m pytest -q
          uv build
