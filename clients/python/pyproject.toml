[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notifyd-sdk"
version = "0.1.0"
description = "Python client for notifyd, the self-hosted notification server (email, SMS, WhatsApp, push, in-app)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "rmzlb" }]
keywords = ["notifyd", "notifications", "email", "sms", "push", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/rmzlb/notifyd"
Documentation = "https://github.com/rmzlb/notifyd/blob/main/docs/llms.txt"
Source = "https://github.com/rmzlb/notifyd/tree/main/clients/python"

[tool.hatch.build.targets.wheel]
packages = ["notifyd"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
