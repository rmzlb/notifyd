title: notifyd
description: Self-hosted notification server. One Rust binary, Postgres only. Email, SMS, WhatsApp, push, in-app inbox. Operated by your agent over MCP. Open source, MIT.
theme: jekyll-theme-minimal
logo: /assets/notifyd-logo.svg
show_downloads: false
exclude:
  - video/node_modules
  - video/out
  - design
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
defaults:
  - scope: { path: "" }
    values: { layout: default }
