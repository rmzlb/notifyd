# notifyd — production docker-compose (Dokploy-ready)
#
# This compose is dual-purpose:
#   - LOCAL DEV: just `docker compose up`, defaults below cover everything.
#     Override DATABASE_URL etc. via a sibling .env file if needed.
#   - DOKPLOY: provide POSTGRES_PASSWORD, ADMIN_API_KEY, JWT_SECRET,
#     RESEND_API_KEY, EMAIL_FROM via the platform UI/API.
#
# notifyd reads config from env vars when /app/notifyd.toml is absent
# (see src/config.rs `from_env`). We deliberately don't mount a TOML so
# the same image works across environments without a config file.
#
# Replicas: live inbox events fan out through Postgres NOTIFY and stream
# tickets live in the database, so several replicas are fine. Outbound pacing
# (EMAIL_RATE_PER_SEC…) is per replica: divide the provider limit by the
# replica count.

services:
  notifyd:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Required ------------------------------------------------------------
      DATABASE_URL: postgres://notifyd:${POSTGRES_PASSWORD:-notifyd}@notifyd-db:5432/notifyd
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (random 32+ chars, used to sign subscriber JWTs)}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY (random 32+ chars, gates /v1/admin/*)}
      # Optional read-only operator key: digest, listings, metrics, read-only MCP tools.
      READONLY_API_KEY: ${READONLY_API_KEY:-}

      # Email connector ----------------------------------------------------
      # EMAIL_PROVIDER: resend (default when RESEND_API_KEY is set) | agentmail
      #                 | cloudflare | smtp | log (development only)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AGENTMAIL_API_KEY: ${AGENTMAIL_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      EMAIL_FROM: ${EMAIL_FROM:-notifications@example.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      # Public base URL of this instance: List-Unsubscribe links on bulk email.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Second provider used when the primary answers 429/5xx (same sender).
      EMAIL_FALLBACK_PROVIDER: ${EMAIL_FALLBACK_PROVIDER:-}
      EMAIL_FAILOVER_COOLDOWN_SECS: ${EMAIL_FAILOVER_COOLDOWN_SECS:-60}

      # SMS connector (SMS_PROVIDER: telnyx | twilio) + WhatsApp (Telnyx) -----
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_FROM: ${SMS_FROM:-}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      TELNYX_MESSAGING_PROFILE_ID: ${TELNYX_MESSAGING_PROFILE_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TELNYX_WHATSAPP_API_KEY: ${TELNYX_WHATSAPP_API_KEY:-}
      WHATSAPP_FROM: ${WHATSAPP_FROM:-}

      # Worker: attempts, outbound pacing (provider requests per second) ----
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      EMAIL_RATE_PER_SEC: ${EMAIL_RATE_PER_SEC:-8}
      SMS_RATE_PER_SEC: ${SMS_RATE_PER_SEC:-10}
      WHATSAPP_RATE_PER_SEC: ${WHATSAPP_RATE_PER_SEC:-10}
      RATE_LIMIT_PAUSE_SECS: ${RATE_LIMIT_PAUSE_SECS:-2}
      # Svix signing secret of the Resend webhook endpoint. Empty = the
      # /webhooks/resend route answers 503 and nothing is ingested.
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}

      # Web Push / PWA connector ------------------------------------------
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PRIVATE_KEY_PEM: ${VAPID_PRIVATE_KEY_PEM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@yourdomain.com}

      # CORS for browsers calling /v1/inbox/*/stream ------------------------
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # Optional -----------------------------------------------------------
      PORT: "3400"
      RUST_LOG: ${RUST_LOG:-notifyd=info}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3400/v1/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      notifyd-db:
        condition: service_healthy
    networks:
      default: {}
      dokploy-network:
        aliases: [notifyd]
    restart: unless-stopped
    deploy:
      replicas: 1   # raise freely; pacing limits are per replica

  notifyd-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifyd
      POSTGRES_USER: notifyd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notifyd}
    volumes:
      - notifyd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifyd -d notifyd"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  # `default` is the per-stack bridge auto-created by compose; notifyd and
  # its DB use it to talk privately. `dokploy-network` is the shared
  # Traefik/swarm overlay — joining it lets neighbouring stacks (e.g.
  # craie-api) reach notifyd at http://notifyd:3400 via the alias above.
  dokploy-network:
    external: true

volumes:
  notifyd_pgdata:
