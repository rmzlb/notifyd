[package]
name = "notifyd"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Agent-first self-hosted notification service. Email, SMS, Push, In-App — one binary, Postgres only."
repository = "https://github.com/rmzlb/notifyd"
homepage = "https://github.com/rmzlb/notifyd"
keywords = ["notifications", "email", "sms", "push", "sse"]
categories = ["web-programming::http-server", "email"]
readme = "README.md"
include = ["src/**", "migrations/**", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/notifyd.toml.example"]

[[bin]]
name = "notifyd"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }

# Crypto
aes-gcm = "0.11"

# DB
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid", "chrono", "json", "macros"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.13", features = ["json", "form", "rustls", "http2"], default-features = false }
web-push = { version = "0.11", default-features = false }
# web-push builds requests with http 0.2; its response parser takes that StatusCode.
http02 = { package = "http", version = "0.2" }

# JWT
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }

# UUID + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Config
toml = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
prometheus = { version = "0.14", default-features = false }
once_cell = "1"

[profile.release]
opt-level = 3
strip = true

# Les ~380 dépendances restent en opt-level = 3 ; seul le crate binaire
# d'orchestration HTTP/SQL compile sans passe d'optimisation LLVM lourde ni
# LTO global à chaque déploiement Dokploy.
[profile.release.package.notifyd]
opt-level = 0
codegen-units = 256

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.dist.package.notifyd]
opt-level = 3
codegen-units = 16
