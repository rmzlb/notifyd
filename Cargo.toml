[package]
name = "notifyd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agent-first self-hosted notification service. Email, SMS, Push, In-App — one binary, Postgres only."
repository = "https://github.com/rmzlb/notifyd"
homepage = "https://github.com/rmzlb/notifyd"
keywords = ["notifications", "email", "sms", "push", "sse"]
categories = ["web-programming::http-server"]

[[bin]]
name = "notifyd"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }

# DB
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "macros"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
web-push = "0.11"

# JWT
jsonwebtoken = "9"

# UUID + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
